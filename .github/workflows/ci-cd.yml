name: Python Flask CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  ci:
    name: CI - Test, SonarQube and Build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: |
          pytest -v

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Create deployment package
        run: |
          zip -r amazon-python-cicd.zip . \
            -x ".git/*" \
               "venv/*" \
               "__pycache__/*" \
               ".pytest_cache/*" \
               "*.pyc"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: amazon-python-cicd
          path: amazon-python-cicd.zip


  cd:
    name: CD - Deploy to EC2
    needs: ci
    runs-on: ubuntu-latest

    steps:

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: amazon-python-cicd

      - name: Copy ZIP to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "amazon-python-cicd.zip"
          target: "/tmp"

      - name: Deploy application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Starting deployment..."

            sudo systemctl stop amazon-python-cicd || true

            sudo rm -rf /opt/amazon-python-cicd/*
            sudo unzip -o /tmp/amazon-python-cicd.zip -d /opt/amazon-python-cicd

            sudo chown -R ec2-user:ec2-user /opt/amazon-python-cicd

            cd /opt/amazon-python-cicd

            python3.12 -m venv venv

            source venv/bin/activate

            pip install --upgrade pip
            pip install -r requirements.txt

            sudo systemctl daemon-reload
            sudo systemctl enable amazon-python-cicd
            sudo systemctl restart amazon-python-cicd

            echo "Deployment completed!"

            sudo systemctl --no-pager status amazon-python-cicd
